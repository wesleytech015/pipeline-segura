name: Pipeline DevSecOps

# Executa em pushes na main e em pull requests que têm a main como destino.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validacao:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Secret Scanning - Gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --config=/repo/.gitleaks.toml --redact=100 --exit-code=1 /repo

      - name: SAST - Semgrep
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            semgrep/semgrep \
            semgrep scan --config p/javascript --error /src/src

      - name: SBOM - Trivy CycloneDX
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Publicar SBOM como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: SCA - Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Build da imagem Docker
        run: docker build -t pipeline-segura-api:ci .

      - name: Container Scan - Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pipeline-segura-api:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: IaC Security - Docker Compose
        shell: bash
        run: |
          docker compose -f docker-compose.yml config --format json |
            jq -e 'all(.services[];
              (.privileged != true) and
              (.network_mode != "host") and
              all(.volumes[]?;
                .source != "/var/run/docker.sock" and
                .source != "/run/docker.sock"
              )
            )'

      - name: IaC Security - Checkov
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            bridgecrew/checkov \
            -d /workspace \
            --framework dockerfile \
            --quiet

      # O cache do npm usa o package-lock.json para compor a chave.
      - name: Configurar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar a sintaxe da aplicação
        run: node --check src/app.js

      - name: Iniciar aplica??o para DAST
        run: |
          docker run -d \
            --name pipeline-segura-dast \
            -p 127.0.0.1:3000:3000 \
            pipeline-segura-api:ci

          for i in {1..15}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/health; then
              echo "API pronta para o DAST"
              exit 0
            fi
            sleep 2
          done

          echo "API n?o iniciou corretamente"
          docker logs pipeline-segura-dast
          exit 1

      - name: DAST - OWASP ZAP
        run: |
          workspace_mode=$(stat -c '%a' "$GITHUB_WORKSPACE")
          trap 'chmod "$workspace_mode" "$GITHUB_WORKSPACE"; docker stop pipeline-segura-dast' EXIT
          chmod a+w "$GITHUB_WORKSPACE"

          docker run --rm \
            --network host \
            -v "$GITHUB_WORKSPACE:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -r zap-report.html \
            -J zap-report.json \
            -I

      - name: Publicar relat?rios do ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: |
            zap-report.html
            zap-report.json

      - name: Iniciar e validar a API
        run: |
          npm start &
          sleep 5
          curl --fail http://localhost:3000/health

      - name: Encerrar aplica??o DAST
        if: always()
        run: docker rm -f pipeline-segura-dast || true