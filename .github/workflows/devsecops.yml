name: Pipeline DevSecOps

# Executa em pushes na main e em pull requests que têm a main como destino.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validacao:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Secret Scanning - Gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --config=/repo/.gitleaks.toml --redact=100 --exit-code=1 /repo

      - name: SAST - Semgrep
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            semgrep/semgrep \
            semgrep scan --config p/javascript --error /src/src

      - name: SBOM - Trivy CycloneDX
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Publicar SBOM como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: SCA - Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      # O cache do npm usa o package-lock.json para compor a chave.
      - name: Configurar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar a sintaxe da aplicação
        run: node --check src/app.js

      - name: Iniciar e validar a API
        run: |
          npm start &
          sleep 5
          curl --fail http://localhost:3000/health